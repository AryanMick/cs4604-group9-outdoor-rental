<text x="60" y="1360" class="note">Arrows: child FK → parent PK.</text>
<text x="60" y="1400" class="note">Each child has exactly one referenced parent.</text>
<text x="60" y="1440" class="note">Parents can have 0..N children, except</text>
<text x="60" y="1480" class="note">RESERVATION → PAYMENT, which is 0..1.</text>
<text x="60" y="1520" class="note">Entity primary keys use AUTO_INCREMENT.</text>
<text x="60" y="1565" class="note">All attributes are NOT NULL. Each reservation covers one equipment item. An employee's business and access supervisor are derived through joins.</text>
<text x="60" y="1605" class="note">Composite primary keys: DEFINES_ACCESS(admin_id, employee_id); ADMIN_PRIVILEGES(admin_id, privilege). See report for assumptions and check constraints.</text>
</svg>
