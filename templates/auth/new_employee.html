{% extends "base.html" %}
{% block title %}New Employee | Outdoor Rental Database{% endblock %}
{% block content %}
    <section class="auth-shell">
    <div class="auth-card">
      <h2>New Employee</h2>
      <p class="auth-intro">Register a new employee account.</p>

      {% for category, message in messages %}
        <div class="auth-message {{ category }}" role="alert">{{ message }}</div>
      {% endfor %}

      <form class="auth-form" action="{{ url_for('new_employee') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% if managers %}
        <label for="manager_id">Manager</label>
        <select id="manager_id" name="manager_id" required>
          <option value="">Choose...</option>
          {% for o in managers %}<option value="{{ o.manager_id }}">{{ o.label }}</option>{% endfor %}
        </select>
        {% endif %}

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label for="first_name">First Name</label>
        <input id="first_name" name="first_name" type="text" autocomplete="first-name" required>
        <label for="last_name">Last Name</label>
        <input id="last_name" name="last_name" type="text" autocomplete="last-name" required>

        <button class="auth-submit" type="submit">Register</button>
      </form>

      <p class="auth-footer"><a href="{{ url_for('dashboard') }}">Return to dashboard</a></p>
    </div>
  </section>
{% endblock %}
