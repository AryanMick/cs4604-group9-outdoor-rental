{% extends "customer/base.html" if is_customer else "base.html" %}
{% block title %}Change Password | Outdoor Rental Database{% endblock %}
{% block content %}
  <section class="auth-shell">
    <div class="auth-card">
      <p class="auth-kicker">Account security</p>
      <h2>Change Password</h2>

      {% for category, message in messages %}
        <div class="auth-message {{ category }}" role="alert">{{ message }}</div>
      {% endfor %}

      <form class="auth-form" action="{{ url_for('change_password') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password"
               autocomplete="current-password" required>

        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password"
               autocomplete="new-password" required>

        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password"
               autocomplete="new-password" required>

        <button class="auth-submit" type="submit">Update Password</button>
      </form>

      <p class="auth-footer"><a href="{{ url_for('profile') }}">Return to profile</a></p>
    </div>
  </section>
{% endblock %}
