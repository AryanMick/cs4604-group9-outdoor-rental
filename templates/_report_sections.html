{% for s in sections %}
  <h3>{{ s.title }}{% if s.aggregates %} <small class="muted">({{ s.aggregates }})</small>{% endif %}</h3>
  {% if s.rows %}
    <div class="table-wrap">
      <table>
        <thead><tr>{% for h in s.headers %}<th>{{ h }}</th>{% endfor %}</tr></thead>
        <tbody>
          {% for row in s.rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>{% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="manager-empty">No data yet.</p>
  {% endif %}
{% endfor %}
