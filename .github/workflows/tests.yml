name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test interface and startup without MySQL
        run: python -m unittest discover -s tests -v
      - name: Test real Windows environment bootstrap in a path with spaces
        shell: python
        run: |
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import sys
          sys.path.insert(0, str(Path.cwd()))
          import start

          with TemporaryDirectory(prefix="rental bootstrap with spaces ") as directory:
              start.PROJECT = Path(directory)
              start.VENV = start.PROJECT / ".venv"
              # No dependencies; a comment ensures the first launch invokes pip.
              (start.PROJECT / "requirements.txt").write_text("# bootstrap smoke test\n", encoding="utf-8")
              (start.PROJECT / "start.py").write_text("print('Windows bootstrap succeeded')\n", encoding="utf-8")
              assert start.run_in_project_environment() == 0
              assert (start.VENV / "Scripts" / "python.exe").is_file()
              stamp = start.VENV / ".requirements-installed"
              installed_at = stamp.stat().st_mtime_ns
              assert start.run_in_project_environment() == 0
              assert stamp.stat().st_mtime_ns == installed_at
